[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-mcp-gateway"
version = "1.0.0"
description = "Zero-dependency MCP proxy/gateway server. Aggregate multiple MCP servers, route by tool prefix, load-balance, and enforce auth."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
keywords = ["mcp", "model-context-protocol", "ai-agents", "proxy", "gateway", "tool-router"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-mcp-gateway"
Repository = "https://github.com/hussain-alsaibai/tiny-mcp-gateway"
Issues = "https://github.com/hussain-alsaibai/tiny-mcp-gateway/issues"

[project.optional-dependencies]
uvicorn = ["uvicorn"]

[tool.setuptools]
py-modules = ["tiny_mcp_gateway"]

[tool.pytest.ini_options]
testpaths = ["test_tiny_mcp_gateway.py"]
python_files = ["test_*.py"]
